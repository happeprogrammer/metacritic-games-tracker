<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 580" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5eead4"/></marker>
    <style>
      .bg { fill: #0b0f16; }
      .box { fill: #121923; stroke: #3a4a66; stroke-width: 1.5; }
      .core { fill: #141d2a; stroke: #5eead4; stroke-width: 2; }
      .ext { fill: #1b1630; stroke: #a78bfa; stroke-width: 1.5; }
      .t { fill: #e7edf5; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .s { fill: #9aa8bd; font-size: 10.5px; text-anchor: middle; }
      .h { fill: #5eead4; font-weight: 700; }
      .l { stroke: #5eead4; stroke-width: 1.8; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect class="bg" width="1040" height="580"/>
  <text x="30" y="38" class="h" font-size="19">Games Tracker: как всё связано</text>

  <!-- left: browser and proxy -->
  <rect class="box" x="20" y="110" width="170" height="70" rx="12"/>
  <text x="105" y="138" class="t">Браузер</text><text x="105" y="157" class="s">список, карточка,</text><text x="105" y="171" class="s">монитор, управление</text>
  <rect class="box" x="20" y="230" width="170" height="70" rx="12"/>
  <text x="105" y="258" class="t">Traefik</text><text x="105" y="277" class="s">HTTPS, сертификат</text>
  <path class="l" d="M105 180V228"/><path class="l" d="M190 265H213"/>

  <!-- container -->
  <rect class="core" x="215" y="70" width="580" height="470" rx="16"/>
  <text x="235" y="96" class="h" font-size="13">Один контейнер: Node.js 24 без зависимостей, до 192 МБ</text>

  <rect class="box" x="235" y="115" width="260" height="70" rx="12"/>
  <text x="365" y="141" class="t">HTTP и вход</text><text x="365" y="160" class="s">роли: проверяющий, наблюдатель,</text><text x="365" y="174" class="s">админ; монитор в реальном времени</text>
  <rect class="box" x="515" y="115" width="260" height="70" rx="12"/>
  <text x="645" y="141" class="t">Планировщик</text><text x="645" y="160" class="s">раз в час, по кнопке, пауза</text><text x="645" y="174" class="s">один прогон за раз</text>

  <rect class="box" x="235" y="205" width="260" height="70" rx="12"/>
  <text x="365" y="231" class="t">Выбор 20 игр дня</text><text x="365" y="250" class="s">New Releases, затем лента «новые»</text><text x="365" y="264" class="s">курсор дня, новый день заново</text>
  <rect class="box" x="515" y="205" width="260" height="70" rx="12"/>
  <text x="645" y="231" class="t">Сборщик</text><text x="645" y="250" class="s">1 запрос в секунду, повторы,</text><text x="645" y="264" class="s">предохранитель при сбоях</text>

  <rect class="box" x="235" y="295" width="260" height="70" rx="12"/>
  <text x="365" y="321" class="t">Очередь задач</text><text x="365" y="340" class="s">в базе, переживает перезапуск</text><text x="365" y="354" class="s">повторы с нарастающей паузой</text>
  <rect class="box" x="515" y="295" width="260" height="70" rx="12"/>
  <text x="645" y="321" class="t">Воркеры ИИ</text><text x="645" y="340" class="s">резюме отзывов и летсплеи</text><text x="645" y="354" class="s">бесплатные лимиты, приоритеты</text>

  <rect class="box" x="235" y="385" width="260" height="70" rx="12"/>
  <text x="365" y="411" class="t">Проверка цитат</text><text x="365" y="430" class="s">пункт без дословной цитаты</text><text x="365" y="444" class="s">из отзывов отбрасывается</text>
  <rect class="box" x="515" y="385" width="260" height="70" rx="12"/>
  <text x="645" y="411" class="t">Похожие игры</text><text x="645" y="430" class="s">описание, жанры, аспекты</text><text x="645" y="444" class="s">TF-IDF, считается у себя</text>

  <rect class="box" x="235" y="475" width="540" height="45" rx="12"/>
  <text x="505" y="502" class="s" font-size="11.5">SQLite: игры, оценки, резюме, очередь, журнал, бэкап раз в сутки</text>

  <!-- arrows inside -->
  <path class="l" d="M645 185V203"/>
  <path class="l" d="M495 240H513"/>
  <path class="l" d="M600 275V285H365V293"/>
  <path class="l" d="M513 330H495"/>
  <path class="l" d="M600 365V375H365V383"/>

  <!-- external -->
  <rect class="ext" x="840" y="125" width="180" height="70" rx="12"/>
  <text x="930" y="153" class="t">Metacritic</text><text x="930" y="172" class="s">страница New Releases</text><text x="930" y="186" class="s">и JSON-интерфейс сайта</text>
  <rect class="ext" x="840" y="255" width="180" height="95" rx="12"/>
  <text x="930" y="281" class="t">Нейросети</text><text x="930" y="300" class="s">бесплатные тарифы:</text><text x="930" y="314" class="s">OpenRouter (основной),</text><text x="930" y="328" class="s">запасные: Groq, Gemini,</text><text x="930" y="342" class="s">GitHub Models</text>
  <rect class="ext" x="840" y="410" width="180" height="70" rx="12"/>
  <text x="930" y="438" class="t">YouTube</text><text x="930" y="457" class="s">поиск летсплеев</text><text x="930" y="471" class="s">и субтитры роликов</text>
  <path class="l" d="M775 240H808V160H838"/>
  <path class="l" d="M775 330H838"/>
  <path class="l" d="M775 352H808V445H838"/>
</svg>
